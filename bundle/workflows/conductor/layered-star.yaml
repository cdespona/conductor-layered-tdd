  # Spoke: cleanup-plan
  # ---------------------------------------------------------------------------
  - name: cleanup_plan_context
    type: script
    description: Build a bounded context projection for the selected cleanup planner.
    input:
      - layer_mapper.output.artifact_path
      - star_step.output.objective
    command: python3
    args:
      - workflows/conductor/scripts/build-layer-context.py
      - --consumer
      - cleanup-planner
      - --map
      - "{{ layer_mapper.output.artifact_path }}"
      - --request
      - "{{ star_step.output.objective }}"
    routes:
      - to: cleanup_planner

  - name: cleanup_planner
    description: Detail one removal-only supersession chain without creating a red-test contract.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - cleanup_plan_context.output.manifest_path
      - cleanup_plan_context.output.selected_layer
      - cleanup_plan_context.output.todo_path
      - cleanup_plan_context.output.allowed_paths
      - cleanup_plan_context.output.forbidden_paths
      - cleanup_plan_context.output.read_only_paths
      - cleanup_plan_context.output.source_context
      - cleanup_plan_context.output.layer_contract
      - cleanup_plan_context.output.request_contract
      - cleanup_plan_context.output.source_fingerprint
      - graphify_status.output.graph_available?
      - graphify_refresh.output.graph_available?
      - star_step.output.brief?
    prompt: !file prompts/cleanup-planner.md
    output:
      artifact_path:
        type: string
      selected_layer:
        type: string
      ready_for_cleanup:
        type: boolean
      blockers:
        type: array
      removal_targets:
        type: array
      summary:
        type: string
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: cleanup_plan_gate
        when: "{{ output.outcome == 'done' and output.ready_for_cleanup }}"
      - to: star_step

  - name: cleanup_plan_gate
    type: human_gate
    prompt: |
      Review the cleanup plan. Cleanup skips test authoring and the expected-red
      gate; safety comes from existing behavior tests, a green baseline, exact
      removal/reference checks, bounded changes, post-cleanup verification, and review.

      Selected layer: `{{ cleanup_planner.output.selected_layer }}`
      Cleanup todo: `{{ cleanup_planner.output.artifact_path }}`
      Ready for cleanup: {{ cleanup_planner.output.ready_for_cleanup }}
      Blockers: {{ cleanup_planner.output.blockers }}
      Removal targets: {{ cleanup_planner.output.removal_targets }}
      Summary: {{ cleanup_planner.output.summary }}
    options:
      - label: Approve this cleanup plan and run the green baseline.
        value: approve_cleanup
        prompt_for: feedback
        route: cleanup_plan_validator
      - label: Revise this same cleanup plan.
        value: revise
        prompt_for: feedback
        route: cleanup_plan_reviser
      - label: Return to layer selection.
        value: select_other_layer
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  - name: cleanup_plan_reviser
    description: Reconcile human feedback into the same cleanup plan.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - cleanup_planner.output.artifact_path
      - cleanup_plan_gate.output.additional_input.feedback?
      - cleanup_plan_revision_gate.output.additional_input.feedback?
      - cleanup_approval_gate.output.additional_input.feedback?
      - star_step.output.brief?
    prompt: !file prompts/cleanup-plan-reviser.md
    output:
      artifact_path:
        type: string
      selected_layer:
        type: string
      ready_for_cleanup:
        type: boolean
      blockers:
        type: array
      removal_targets:
        type: array
      summary:
        type: string
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: cleanup_plan_revision_gate
        when: "{{ output.outcome == 'done' and output.ready_for_cleanup }}"
      - to: star_step

  - name: cleanup_plan_revision_gate
    type: human_gate
    prompt: |
      Review the revised cleanup plan. It remains the same selected cleanup
      layer and must not contain observable behavior changes.

      Selected layer: `{{ cleanup_plan_reviser.output.selected_layer }}`
      Cleanup todo: `{{ cleanup_plan_reviser.output.artifact_path }}`
      Ready for cleanup: {{ cleanup_plan_reviser.output.ready_for_cleanup }}
      Blockers: {{ cleanup_plan_reviser.output.blockers }}
      Removal targets: {{ cleanup_plan_reviser.output.removal_targets }}
      Summary: {{ cleanup_plan_reviser.output.summary }}
    options:
      - label: Approve this cleanup plan and run the green baseline.
        value: approve_cleanup
        prompt_for: feedback
        route: cleanup_plan_validator
      - label: Revise this same cleanup plan again.
        value: revise
        prompt_for: feedback
        route: cleanup_plan_reviser
      - label: Return to layer selection.
        value: select_other_layer
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

