    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: cleanup_approval_gate

  - name: cleanup_approval_gate
    type: human_gate
    prompt: |
      Review the cleanup result and reviewer notes.

      Cleaned layer: `{{ cleanup_implementor.output.selected_layer }}`
      Reviewed artifact: `{{ cleanup_reviewer.output.artifact_path }}`
      Approval recommended: {{ cleanup_reviewer.output.approved_recommendation }}
      More layers remaining: {{ cleanup_reviewer.output.more_layers_remaining }}
      Review issues: {{ cleanup_reviewer.output.issues }}
      Summary: {{ cleanup_reviewer.output.summary }}
    options:
      - label: Approve this cleanup and choose another layer.
        value: approve_more_layers
        prompt_for: feedback
        route: star_step
      - label: Approve this cleanup and run final slice review.
        value: approve_final_review
        prompt_for: feedback
        route: star_step
      - label: Send this cleanup back for focused removal fixes.
        value: request_fixes
        prompt_for: feedback
        route: star_step
      - label: Revise the cleanup plan because its contract changed.
        value: revise_plan
        prompt_for: feedback
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  # ---------------------------------------------------------------------------
  # Spoke: final
  # ---------------------------------------------------------------------------
  - name: slice_acceptance_final
    type: script
    description: Require unchanged approved support and green real slice acceptance before final review.
    input:
      - slice_acceptance_prepare.output.state_path
    command: python3
    args:
      - workflows/conductor/scripts/slice-acceptance.py
      - final
      - "{{ slice_acceptance_prepare.output.state_path }}"
    timeout: 600
    routes:
      - to: final_reviewer
        when: "{{ output.proceed }}"
      - to: star_step

  - name: final_reviewer
    description: Review the whole selected slice and propose memory candidates.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - slice_acceptance_final.output
      - slice_acceptance_planner.output.artifact_path
      - layer_mapper.output.artifact_path
      - star_step.output.brief?
    prompt: !file prompts/final-reviewer.md
    output:
      artifact_path:
        type: string
        description: Path to 99-final-review.md.
      memory_candidates:
        type: array
        description: Proposed memory candidates.
      residual_risks:
        type: array
        description: Residual risks or verification gaps.
      ready_to_finish:
        type: boolean
        description: Whether the slice is ready to finish.
      summary:
        type: string
        description: Final review summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: memory
  # ---------------------------------------------------------------------------
  - name: memory_gate
    type: human_gate
    prompt: |
      Review `99-final-review.md`. Approve only the memory candidates worth
      capturing with the repository's existing memory workflow.

      Final review artifact: `{{ final_reviewer.output.artifact_path }}`
      Ready to finish: {{ final_reviewer.output.ready_to_finish }}
      Residual risks: {{ final_reviewer.output.residual_risks }}
      Memory candidates: {{ final_reviewer.output.memory_candidates }}
      Summary: {{ final_reviewer.output.summary }}
    options:
      - label: Capture approved memory candidates separately.
        value: capture
        prompt_for: feedback
        route: memory_capturer
      - label: Finish without memory capture.
        value: skip
        prompt_for: feedback
        route: star_step
      - label: Revise the final review first.
        value: revise_review
        prompt_for: feedback
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step

  - name: memory_capturer
    description: Persist human-approved memory candidates from the final review.
    model: gpt-6-luna
    reasoning:
      effort: low
    input:
      - final_reviewer.output.artifact_path
      - layer_mapper.output.artifact_path
      - workflow.input.memory_vault?
      - workflow.input.memory_namespace?
      - workflow.input.memory_project?
      - star_step.output.brief?
    prompt: !file prompts/memory-capturer.md
    output:
      artifact_path:
        type: string
        description: Path to the final review artifact that was processed.
      captured_count:
        type: number
        description: Number of memory candidates captured or staged.
      capture_backend:
        type: string
        description: Memory backend used, either markdown or unavailable.
      capture_artifacts:
        type: array
        description: Observation IDs, topic keys, or markdown files written.
      summary:
        type: string
        description: Short memory capture summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Terminals
  # ---------------------------------------------------------------------------
  - name: done
    type: terminate
    status: success
    input:
      - star_step.output.ledger_path?
      - star_step.output.plan_dir?
      - star_step.output.reason?
    reason: Star layered TDD run complete.
    output_template:
      status: complete
      ledger: "{{ star_step.output.ledger_path }}"
      plan: "{{ star_step.output.plan_dir }}"
      reason: "{{ star_step.output.reason }}"

  - name: stopped
    type: terminate
    status: success
    reason: Human stopped the star layered TDD workflow.
    output_template:
      status: stopped
      reason: Human stopped the star layered TDD workflow.

  - name: cancelled
    type: terminate
    status: success
    reason: Human cancelled the run at the objective gate.
    output_template:
      status: cancelled
      reason: Human cancelled the run at the objective gate.

  - name: failed
    type: terminate
    status: failed
    input:
      - star_step.output.reason?
      - star_step.output.ledger_path?
    reason: "Star router stopped: {{ star_step.output.reason }}"
    output_template:
      status: failed
      reason: "{{ star_step.output.reason }}"
      ledger: "{{ star_step.output.ledger_path }}"
