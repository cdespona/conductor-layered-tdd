      Resolve every modeling/architectural question before approval. Approve
      preservation mode only for work that introduces no observable behavior.
      Plan: `{{ slice_acceptance_planner.output.artifact_path }}`
      Summary: {{ slice_acceptance_planner.output.summary }}
    options:
      - label: Approve this concrete design and support scope; build it.
        value: approve
        route: star_step
      - label: Resolve questions or revise the acceptance design.
        value: revise
        prompt_for: feedback
        route: slice_acceptance_planner
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  # ---------------------------------------------------------------------------
  # Spoke: acceptance-build
  # ---------------------------------------------------------------------------
  - name: slice_acceptance_prepare
    type: script
    description: Freeze the approved acceptance plan and snapshot all existing work.
    input:
      - slice_acceptance_planner.output.artifact_path
    command: python3
    args:
      - workflows/conductor/scripts/slice-acceptance.py
      - prepare
      - "{{ slice_acceptance_planner.output.artifact_path }}"
    routes:
      - to: slice_acceptance_builder
        when: "{{ output.proceed }}"
      - to: star_step

  - name: slice_acceptance_builder
    description: Build functional black-box acceptance and explicitly approved persistence/setup support.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - slice_acceptance_planner.output.artifact_path
      - star_step.output.brief?
    prompt: !file prompts/slice-acceptance-builder.md
    output:
      summary:
        type: string
        description: Actual support changes and any unresolved blockers.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: slice_acceptance_verify

  - name: slice_acceptance_verify
    type: script
    description: Check exact support scope, harness readiness, green regression and repeatable expected red.
    input:
      - slice_acceptance_prepare.output.state_path
    command: python3
    args:
      - workflows/conductor/scripts/slice-acceptance.py
      - verify
      - "{{ slice_acceptance_prepare.output.state_path }}"
    timeout: 600
    routes:
      - to: slice_acceptance_validation_gate
        when: "{{ output.proceed }}"
      - to: star_step

  - name: slice_acceptance_validation_gate
    type: human_gate
    prompt: |
      Review the actual test, DSL, drivers, fixtures and approved persistence changes.
      Inspect full evidence: readiness must pass; regression excludes only the
      named outer ATs. Each expected test ID must report two failures for missing
      product behavior. Check that each test covers its approved scenario.
      Compilation errors, missing drivers, fabricated outcomes or environment
      failures are blockers. Validate the real boundary and setup semantics.
      Plan: `{{ slice_acceptance_planner.output.artifact_path }}`
      Changed files: {{ slice_acceptance_verify.output.changed_files }}
      Full support patch: `{{ slice_acceptance_verify.output.patch_path }}`
      Evidence: {{ slice_acceptance_verify.output.evidence }}
      Summary: {{ slice_acceptance_verify.output.summary }}
    options:
      - label: Validate the built acceptance contract and evidence; start layers.
        value: approve
        route: slice_acceptance_approve
      - label: Revise design or support before starting layers.
        value: revise
        prompt_for: feedback
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  - name: slice_acceptance_approve
    type: script
    description: Record human validation only if the verified acceptance contract is unchanged.
    input:
      - slice_acceptance_prepare.output.state_path
    command: python3
    args:
      - workflows/conductor/scripts/slice-acceptance.py
      - approve
      - "{{ slice_acceptance_prepare.output.state_path }}"
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: layer-map
  # ---------------------------------------------------------------------------
  - name: layer_mapper
    description: Map real repository boundaries and skeleton layer todos.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - slice_acceptance_planner.output.artifact_path
      - requirements_griller.output.artifact_path
      - slice_run_starter.output.artifact_path?
      - graphify_status.output.graph_available?
      - graphify_refresh.output.graph_available?
      - star_step.output.brief?
    prompt: !file prompts/layer-mapper.md
    output:
      artifact_path:
        type: string
        description: Path to 01-layer-map.md.
      layer_count:
        type: number
        description: Number of layers in the selected slice.
      recommended_next_layer:
        type: string
        description: Recommended next layer identifier or todo filename.
      summary:
        type: string
        description: Short layer map summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: layer_map_gate

  - name: layer_map_gate
    type: human_gate
    prompt: |
      Review `01-layer-map.md` and its skeleton todos, including each layer's
      `work_kind` (behavior, cleanup or infrastructure) and `layer_size`.
      Approving the map is the human approval that exempts cleanup and
      infrastructure layers from the red-test gate.

      Layer map artifact: `{{ layer_mapper.output.artifact_path }}`
      Layer count: {{ layer_mapper.output.layer_count }}
      Recommended next layer: `{{ layer_mapper.output.recommended_next_layer }}`
      Summary: {{ layer_mapper.output.summary }}
    options:
      - label: Approve this layer map.
        value: approve
        prompt_for: feedback
        route: star_step
      - label: Revise the layer map.
        value: revise_map
        prompt_for: feedback
        route: layer_map_reviser
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  - name: layer_map_reviser
    description: Reconcile human feedback into the active layer map.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - slice_acceptance_planner.output.artifact_path
      - layer_mapper.output.artifact_path
      - star_step.output.brief?
    prompt: !file prompts/layer-map-reviser.md
    output:
      artifact_path:
        type: string
        description: The same layer-map artifact revised in place.
      layer_count:
        type: number
        description: Number of layers after revision.
      recommended_next_layer:
        type: string
        description: Recommended next layer identifier or todo filename.
      summary:
        type: string
        description: Short layer-map revision summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: layer_map_revision_gate

  - name: layer_map_revision_gate
    type: human_gate
    prompt: |
      Review the layer-map revision. This is the same active slice folder;
      the map and its skeleton todos were reconciled in place.

      Layer map artifact: `{{ layer_map_reviser.output.artifact_path }}`
      Layer count: {{ layer_map_reviser.output.layer_count }}
      Recommended next layer: `{{ layer_map_reviser.output.recommended_next_layer }}`
      Summary: {{ layer_map_reviser.output.summary }}
    options:
      - label: Approve this revised layer map.
        value: approve
        prompt_for: feedback
        route: star_step
      - label: Revise this same layer map again.
        value: revise_map
        prompt_for: feedback
        route: layer_map_reviser
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  # ---------------------------------------------------------------------------
  # Spoke: layer-select
  # ---------------------------------------------------------------------------
  - name: layer_selection_gate
    type: human_gate
    prompt: |
      Choose the next layer to run. Enter the selected layer id in the gate
      field; the workflow records it in the layer map.

      Layer map artifact: `{{ layer_mapper.output.artifact_path }}`
      {% if cleanup_reviewer is defined and cleanup_reviewer.output is defined and cleanup_reviewer.output.recommended_next_layer is defined and cleanup_reviewer.output.recommended_next_layer %}
      Recommended next layer: `{{ cleanup_reviewer.output.recommended_next_layer }}`
      {% elif layer_reviewer is defined and layer_reviewer.output is defined and layer_reviewer.output.recommended_next_layer is defined and layer_reviewer.output.recommended_next_layer %}
      Recommended next layer: `{{ layer_reviewer.output.recommended_next_layer }}`
      {% else %}
      Recommended next layer: `{{ layer_mapper.output.recommended_next_layer }}`
      {% endif %}
    options:
      - label: I selected the next layer to run.
        value: selected
        prompt_for: selected_layer
        route: layer_selection_recorder
      - label: Revise the layer map before selecting a layer.
        value: revise_map
        prompt_for: feedback
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  - name: layer_selection_recorder
    type: script
    description: Persist the selected layer before generating its todo.
    input:
      - layer_mapper.output.artifact_path
      - layer_selection_gate.output.additional_input.selected_layer
    command: python3
    args:
      - workflows/conductor/scripts/record-layer-selection.py
      - "{{ layer_mapper.output.artifact_path }}"
      - "{{ layer_selection_gate.output.additional_input.selected_layer }}"
    routes:
      - to: selected_layer_router

  - name: selected_layer_router
    type: script
    description: Classify the selected layer by its explicit work kind (a fact for the router).
    input:
      - layer_mapper.output.artifact_path
    command: python3
    args:
      - workflows/conductor/scripts/route-selected-layer.py
      - "{{ layer_mapper.output.artifact_path }}"
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: layer-todo
  # ---------------------------------------------------------------------------
  - name: selected_layer_context
    type: script
    description: Build a bounded context projection for the selected layer todo generator.
    input:
      - layer_mapper.output.artifact_path
      - star_step.output.objective
    command: python3
    args:
      - workflows/conductor/scripts/build-layer-context.py
      - --consumer
      - todo-generator
      - --map
      - "{{ layer_mapper.output.artifact_path }}"
      - --request
      - "{{ star_step.output.objective }}"
    routes:
      - to: layer_todo_generator

  - name: layer_todo_generator
    description: Detail the selected layer todo with Gherkin and TDD gate state.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - selected_layer_context.output.manifest_path
      - selected_layer_context.output.selected_layer
      - selected_layer_context.output.layer_map_path
      - selected_layer_context.output.todo_path
      - selected_layer_context.output.allowed_paths
      - selected_layer_context.output.forbidden_paths
      - selected_layer_context.output.read_only_paths
      - selected_layer_context.output.production_files
      - selected_layer_context.output.test_files
      - selected_layer_context.output.source_context
      - selected_layer_context.output.source_context_bytes
      - selected_layer_context.output.source_context_truncated
      - selected_layer_context.output.layer_map_excerpt
      - selected_layer_context.output.layer_contract
      - selected_layer_context.output.request_contract
      - selected_layer_context.output.request_contract_truncated
      - selected_layer_context.output.source_fingerprint
      - slice_acceptance_prepare.output.regression_command
      - graphify_status.output.graph_available?
      - graphify_refresh.output.graph_available?
      - star_step.output.brief?
    prompt: !file prompts/layer-todo-generator.md
    output:
      artifact_path:
        type: string
        description: Path to the selected layer todo.
      selected_layer:
        type: string
        description: Selected layer identifier.
      test_ownership:
        type: string
        description: human-written, agent-written-after-approval, or waived.
      red_gate_state:
        type: string
        description: observed-red, not-run-human-approved, already-passing-human-approved, waived, or blocked.
      ready_for_implementation:
        type: boolean
        description: True only when the layer has an allowed red-test gate state.
      summary:
        type: string
        description: Short summary of the layer todo.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: layer_todo_gate

  - name: layer_todo_gate
    type: human_gate
    prompt: |
      Review the selected layer todo, including `layer_size`. Approve the Gherkin and test ownership.
      The workflow then runs the approved regression suite as the deterministic
      red-test check before production implementation; only the named outer AT is excluded.
      Infrastructure layers approved in the layer map may skip the red-test gate.

      Selected layer: `{{ layer_todo_generator.output.selected_layer }}`
      Layer todo artifact: `{{ layer_todo_generator.output.artifact_path }}`
      Test ownership: `{{ layer_todo_generator.output.test_ownership }}`
      Red-test gate state: `{{ layer_todo_generator.output.red_gate_state }}`
      Ready for implementation: {{ layer_todo_generator.output.ready_for_implementation }}
      Summary: {{ layer_todo_generator.output.summary }}
    options:
      - label: Gherkin is approved; have the agent author the top-level test.
        value: author_agent_test
        prompt_for: feedback
        route: star_step
      - label: Gherkin is approved; verify the existing top-level test with the full suite.
        value: verify_existing_test
        prompt_for: feedback
        route: star_step
      - label: Infrastructure layer approved in the map; implement without a new test.
        value: approve_infrastructure
        prompt_for: feedback
        route: star_step
      - label: Revise the layer todo or gate state.
        value: revise
        prompt_for: feedback
        route: layer_todo_reviser
      - label: Go back to layer selection.
        value: select_other_layer
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  - name: layer_todo_reviser
    description: Reconcile human or checkpoint feedback into the active layer todo.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - layer_todo_generator.output.artifact_path
      - layer_todo_gate.output?
      - layer_todo_revision_gate.output?
      - red_suite_evidence_gate.output?
      - star_step.output.brief?
    prompt: !file prompts/layer-todo-reviser.md
    output:
      artifact_path:
        type: string
        description: The same layer todo revised in place.
      selected_layer:
        type: string
        description: Unchanged selected layer identifier.
      test_ownership:
        type: string
        description: human-written, agent-written-after-approval, or waived.
      red_gate_state:
        type: string
        description: Red-test gate state after revision.
      ready_for_implementation:
        type: boolean
        description: True only when the revised todo has an allowed red-test state.
      summary:
        type: string
        description: Short layer-todo revision summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: layer_todo_revision_gate

  - name: layer_todo_revision_gate
    type: human_gate
    prompt: |
      Review the layer-todo revision. This is the same active todo, revised in
      place; it is not a new layer or a new plan folder.

      Selected layer: `{{ layer_todo_reviser.output.selected_layer }}`
      Layer todo artifact: `{{ layer_todo_reviser.output.artifact_path }}`
      Test ownership: `{{ layer_todo_reviser.output.test_ownership }}`
      Red-test gate state: `{{ layer_todo_reviser.output.red_gate_state }}`
      Ready for implementation: {{ layer_todo_reviser.output.ready_for_implementation }}
      Summary: {{ layer_todo_reviser.output.summary }}
    options:
      - label: Gherkin is approved; have the agent author the top-level test.
        value: author_agent_test
        prompt_for: feedback
        route: star_step
      - label: Gherkin is approved; verify the existing top-level test with the full suite.
        value: verify_existing_test
        prompt_for: feedback
        route: star_step
      - label: Infrastructure layer approved in the map; implement without a new test.
        value: approve_infrastructure
        prompt_for: feedback
        route: star_step
      - label: Revise this same layer todo or gate state again.
        value: revise
        prompt_for: feedback
        route: layer_todo_reviser
      - label: Go back to layer selection.
        value: select_other_layer
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  # ---------------------------------------------------------------------------
  # Spoke: test-author
  # ---------------------------------------------------------------------------
  - name: test_author_preparer
    type: script
    description: Record the approved handoff and mark only top-level test tasks in progress.
    input:
      - layer_todo_generator.output.artifact_path
      - layer_todo_gate.output.additional_input.feedback?
      - layer_todo_revision_gate.output?
    command: python3
    args:
      - workflows/conductor/scripts/record-test-author.py
      - prepare
      - --artifact
      - "{{ layer_todo_generator.output.artifact_path }}"
      - --feedback
      - >-
        {% if layer_todo_revision_gate is defined and layer_todo_revision_gate.output is defined %}{{ layer_todo_revision_gate.output.additional_input.feedback | default("") }}{% else %}{{ layer_todo_gate.output.additional_input.feedback | default("") }}{% endif %}
    routes:
      - to: test_author_context
        when: "{{ output.proceed }}"
      - to: star_step

  - name: test_author_context
    type: script
    description: Build a narrow context projection after the approved handoff is recorded.
    input:
      - layer_todo_generator.output.artifact_path
      - star_step.output.objective
    command: python3
    args:
      - workflows/conductor/scripts/build-layer-context.py
      - --consumer
      - test-author
      - --todo
      - "{{ layer_todo_generator.output.artifact_path }}"
      - --request
      - "{{ star_step.output.objective }}"
    routes:
      - to: test_author_snapshot

  - name: test_author_snapshot
    type: script
    description: Capture the exact tree after deterministic handoff state and before test authoring.
    command: python3
    args:
      - workflows/conductor/scripts/capture-layer-snapshot.py
    routes:
      - to: agent_test_author

  - name: agent_test_author
    description: Author the approved top-level test without changing production code.
    model: "{{ 'gpt-6-luna' if star_step.output.model_tier == 'small' else 'claude-sonnet-5.5' }}"
    input:
      - test_author_context.output.manifest_path
      - test_author_context.output.layer_size
      - test_author_context.output.selected_layer
      - test_author_context.output.layer_map_path
      - test_author_context.output.todo_path
      - test_author_context.output.allowed_paths
      - test_author_context.output.forbidden_paths
      - test_author_context.output.read_only_paths
      - test_author_context.output.production_files
      - test_author_context.output.test_files
      - test_author_context.output.repository_skill_paths
      - test_author_context.output.source_context
      - test_author_context.output.source_context_bytes
      - test_author_context.output.source_context_truncated
      - test_author_context.output.layer_contract
      - test_author_context.output.request_contract
      - test_author_context.output.request_contract_truncated
      - test_author_context.output.source_fingerprint
      - graphify_status.output.graph_available?
      - graphify_refresh.output?
      - star_step.output.model_tier
      - star_step.output.reasoning_effort
      - star_step.output.brief?
    reasoning:
      effort: "{{ star_step.output.reasoning_effort }}"
    prompt: !file prompts/agent-test-author.md
    output:
      selected_layer:
        type: string
        description: Layer whose approved top-level test was authored.
      test_files_modified:
        type: array
        description: Top-level test files created or changed; production files are excluded.
      checkpoint_required:
        type: boolean
        description: True when authoring the approved test exposed new top-level behavior or a contradiction.
      checkpoint_summary:
        type: string
        description: Checkpoint details if human routing is required.
      summary:
        type: string
        description: Test-authoring summary with no production implementation.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: test_author_completion_recorder

  - name: test_author_completion_recorder
    type: script
    description: Validate test-only changes (I5) and mark only approved test tasks complete.
    input:
      - test_author_context.output.todo_path
      - test_author_context.output.manifest_path
      - test_author_snapshot.output.snapshot_tree
      - agent_test_author.output.test_files_modified
      - agent_test_author.output.checkpoint_required
    command: python3
    args:
      - workflows/conductor/scripts/record-test-author.py
      - complete
      - --artifact
      - "{{ test_author_context.output.todo_path }}"
      - --manifest
      - "{{ test_author_context.output.manifest_path }}"
      - --snapshot-tree
      - "{{ test_author_snapshot.output.snapshot_tree }}"
      - --reported-files
      - "{{ agent_test_author.output.test_files_modified | json }}"
      - --checkpoint-required
      - "{{ 'true' if agent_test_author.output.checkpoint_required else 'false' }}"
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: red-gate
  # ---------------------------------------------------------------------------
  - name: red_suite_verifier
    type: script
    description: Run approved layer regression and emit bounded expected-red evidence without failing the workflow.
    input:
      - slice_acceptance_prepare.output.regression_command
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - red-suite
      - --command
      - "{{ slice_acceptance_prepare.output.regression_command }}"
    timeout: 600
    routes:
      - to: red_suite_evidence_recorder

  - name: red_suite_evidence_recorder
    type: script
    description: Persist full-suite red-gate evidence in the active layer todo.
    input:
      - layer_todo_generator.output.artifact_path
      - red_suite_verifier.output.evidence_path
      - red_suite_verifier.output.exit_code
      - red_suite_verifier.output.output_bytes
      - red_suite_verifier.output.bounded_excerpt
      - slice_acceptance_prepare.output.regression_command
    command: python3
    args:
      - workflows/conductor/scripts/record-red-gate.py
      - evidence
      - --artifact
      - "{{ layer_todo_generator.output.artifact_path }}"
      - --command
      - "{{ slice_acceptance_prepare.output.regression_command }}"
      - --exit-code
      - "{{ red_suite_verifier.output.exit_code }}"
      - --evidence-path
      - "{{ red_suite_verifier.output.evidence_path }}"
      - --output-bytes
      - "{{ red_suite_verifier.output.output_bytes }}"
      - --excerpt
      - "{{ red_suite_verifier.output.bounded_excerpt }}"
    routes:
      - to: red_suite_evidence_gate

  - name: red_suite_evidence_gate
    type: human_gate
    prompt: |
      Review the deterministic full-suite result before any production work.
      The decision and optional comment below are written to the active todo
      automatically; do not edit frontmatter or a dashboard by hand.

      Active layer todo: `{{ layer_todo_generator.output.artifact_path }}`
      Regression command: `{{ slice_acceptance_prepare.output.regression_command }}`
      Exit code: {{ red_suite_verifier.output.exit_code }}
      Evidence: `{{ red_suite_verifier.output.evidence_path }}`
      Summary: {{ red_suite_evidence_recorder.output.summary }}
    options:
      - label: The full-suite failure is the expected red evidence; implement.
        value: confirm_red
        prompt_for: feedback
        route: red_gate_decision_recorder
      - label: The full suite is green; accept the existing coverage and implement.
        value: accept_green
        prompt_for: feedback
        route: red_gate_decision_recorder
      - label: Revise the same layer todo or test contract.
        value: revise
        prompt_for: feedback
        route: star_step
      - label: Go back to layer selection.
        value: select_other_layer
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

  - name: red_gate_decision_recorder
    type: script
    description: Persist the human red-gate decision; the router allows implementation only when it proceeds.
    input:
      - layer_todo_generator.output.artifact_path
      - red_suite_verifier.output.evidence_path
      - red_suite_verifier.output.exit_code
      - red_suite_evidence_gate.output.selected
      - red_suite_evidence_gate.output.additional_input.feedback?
      - slice_acceptance_prepare.output.regression_command
    command: python3
    args:
      - workflows/conductor/scripts/record-red-gate.py
      - decision
      - --artifact
      - "{{ layer_todo_generator.output.artifact_path }}"
      - --selection
      - "{{ red_suite_evidence_gate.output.selected }}"
      - --feedback
      - '{{ red_suite_evidence_gate.output.additional_input.feedback | default("") }}'
      - --command
      - "{{ slice_acceptance_prepare.output.regression_command }}"
      - --exit-code
      - "{{ red_suite_verifier.output.exit_code }}"
      - --evidence-path
      - "{{ red_suite_verifier.output.evidence_path }}"
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: implement
  # ---------------------------------------------------------------------------
  - name: implementation_context
    type: script
    description: Refresh the bounded context projection immediately before implementation.
    input:
      - layer_todo_generator.output.artifact_path
      - star_step.output.objective
    command: python3
    args:
      - workflows/conductor/scripts/build-layer-context.py
      - --consumer
      - implementor
      - --todo
      - "{{ layer_todo_generator.output.artifact_path }}"
      - --request
      - "{{ star_step.output.objective }}"
    routes:
      - to: layer_snapshot

  - name: layer_snapshot
    type: script
    description: Capture the exact working tree immediately before this layer is implemented.
    command: python3
    args:
      - workflows/conductor/scripts/capture-layer-snapshot.py
    routes:
      - to: implementor

  - name: implementor
    description: Implement only inside the approved layer boundary.
    model: "{{ 'gpt-6-luna' if star_step.output.model_tier == 'small' else 'claude-sonnet-5.5' }}"
    reasoning:
      effort: "{{ star_step.output.reasoning_effort }}"
    input:
      - implementation_context.output.manifest_path
      - implementation_context.output.layer_size
      - implementation_context.output.selected_layer
      - implementation_context.output.layer_map_path
      - implementation_context.output.todo_path
      - implementation_context.output.allowed_paths
      - implementation_context.output.forbidden_paths
      - implementation_context.output.read_only_paths
      - implementation_context.output.production_files
      - implementation_context.output.test_files
      - implementation_context.output.source_context
      - implementation_context.output.source_context_bytes
      - implementation_context.output.source_context_truncated
      - implementation_context.output.layer_contract
      - implementation_context.output.request_contract
      - implementation_context.output.request_contract_truncated
      - implementation_context.output.source_fingerprint
      - graphify_status.output.graph_available?
      - graphify_refresh.output.graph_available?
      - star_step.output.model_tier
      - star_step.output.reasoning_effort
      - star_step.output.brief?
    prompt: !file prompts/implementor.md
    output:
      selected_layer:
        type: string
        description: Layer implemented.
      files_modified:
        type: array
        description: Files created or changed.
      checkpoint_required:
        type: boolean
        description: True when new top-level behavior or contradiction was found.
      checkpoint_summary:
        type: string
        description: Checkpoint details if human routing is required.
      summary:
        type: string
        description: Implementation summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: verify
  # ---------------------------------------------------------------------------
  - name: verification_tests
    type: script
    description: Run the configured test command and retain complete evidence outside the reviewer prompt.
    input:
      - slice_acceptance_prepare.output.regression_command
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - verification-tests
      - --command
      - "{{ slice_acceptance_prepare.output.regression_command }}"
    timeout: 600
    routes:
      - to: verification_lint

  - name: verification_lint
    type: script
    description: Run lint/static checks and retain complete evidence outside the reviewer prompt.
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - verification-lint
      - --command
      - "{{ workflow.input.lint_command }}"
    timeout: 600
    routes:
      - to: verification_security

  - name: verification_security
    type: script
    description: Run dependency/CVE checks and retain complete evidence outside the reviewer prompt.
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - verification-security
      - --command
      - "{{ workflow.input.security_command }}"
    timeout: 600
    routes:
      - to: layer_diff

  - name: layer_diff
    type: script
    description: Build a bounded layer-only patch and classify changed paths against the approved boundary.
    input:
      - layer_snapshot.output.snapshot_tree
      - layer_todo_generator.output.artifact_path
      - star_step.output.ledger_sha
    command: python3
    args:
      - workflows/conductor/scripts/create-layer-diff.py
      - --snapshot-tree
      - "{{ layer_snapshot.output.snapshot_tree }}"
      - --todo
      - "{{ layer_todo_generator.output.artifact_path }}"
      - --ledger-sha
      - "{{ star_step.output.ledger_sha }}"
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: layer-review
  # ---------------------------------------------------------------------------
  - name: layer_reviewer
    description: Review one completed layer and record risks or gaps.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - layer_todo_generator.output.artifact_path
      - verification_tests.output.exit_code
      - verification_tests.output.duration_ms
      - verification_tests.output.passed_count
      - verification_tests.output.failed_count
      - verification_tests.output.failed_test_names
      - verification_tests.output.bounded_excerpt
      - verification_tests.output.evidence_path
      - verification_tests.output.output_bytes
      - verification_tests.output.summary_truncated
      - verification_lint.output.exit_code
      - verification_lint.output.duration_ms
      - verification_lint.output.passed_count
      - verification_lint.output.failed_count
      - verification_lint.output.failed_test_names
      - verification_lint.output.bounded_excerpt
      - verification_lint.output.evidence_path
      - verification_lint.output.output_bytes
      - verification_lint.output.summary_truncated
      - verification_security.output.exit_code
      - verification_security.output.duration_ms
      - verification_security.output.passed_count
      - verification_security.output.failed_count
      - verification_security.output.failed_test_names
      - verification_security.output.bounded_excerpt
      - verification_security.output.evidence_path
      - verification_security.output.output_bytes
      - verification_security.output.summary_truncated
      - layer_diff.output.changed_files
      - layer_diff.output.bounded_patch
      - layer_diff.output.patch_path
      - layer_diff.output.patch_bytes
      - layer_diff.output.patch_truncated
      - layer_diff.output.boundary_status
      - layer_diff.output.boundary_violations
      - layer_diff.output.allowed_paths
      - layer_diff.output.forbidden_paths
      - layer_diff.output.boundary_exempt_paths
      - implementation_context.output.request_contract
      - slice_acceptance_prepare.output.regression_command
      - workflow.input.lint_command
      - workflow.input.security_command
      - graphify_status.output.graph_available?
      - graphify_refresh.output.graph_available?
      - star_step.output.brief?
    prompt: !file prompts/layer-reviewer.md
    output:
      artifact_path:
        type: string
        description: Path updated by the layer review.
      approved_recommendation:
        type: boolean
        description: Whether the reviewer recommends human approval.
      more_layers_remaining:
        type: boolean
        description: Whether unfinished layers remain.
      recommended_next_layer:
        type: string
        description: First eligible unfinished layer after the reviewed layer, or empty when none remain.
      issues:
        type: array
        description: Specific issues, risks, or verification gaps.
      summary:
        type: string
        description: Layer review summary.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: layer_approval_gate

  - name: layer_approval_gate
    type: human_gate
    prompt: |
      Review the layer result and the reviewer notes. Approve the layer, request
      a focused fix, select another layer, or finish the slice.

      Implemented layer: `{{ implementor.output.selected_layer }}`
      Reviewed artifact: `{{ layer_reviewer.output.artifact_path }}`
      Approval recommended: {{ layer_reviewer.output.approved_recommendation }}
      More layers remaining: {{ layer_reviewer.output.more_layers_remaining }}
      Review issues: {{ layer_reviewer.output.issues }}
      Summary: {{ layer_reviewer.output.summary }}
    options:
      - label: Approve this layer and choose another layer.
        value: approve_more_layers
        prompt_for: feedback
        route: star_step
      - label: Approve this layer and run final slice review.
        value: approve_final_review
        prompt_for: feedback
        route: star_step
      - label: Send the layer back to the implementor for focused fixes.
        value: request_fixes
        prompt_for: feedback
        route: star_step
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this slice.
        value: stop
        route: star_step

