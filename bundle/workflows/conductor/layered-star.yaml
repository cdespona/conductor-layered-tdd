# Star-shaped layered TDD workflow for Microsoft Conductor.
#
# Run (or use `ltdd run`):
#   conductor run workflows/conductor/layered-star.yaml \
#     --workspace-instructions \
#     --web \
#     --input request="Describe the code-changing task"
#
# Fixed entry: preflight -> graphify -> objective gate (only without a request).
# Then every spoke returns to `star_step`: a deterministic router (canonical
# table in star/canonical-table.json) plus the guard (invariants I1-I10). The
# hub agent is called only on frontier cases; non-obvious hub jumps go to the
# generic `confirm_gate`. The ledger is .github/plans/<slug>/star-state.json.
#
# This workflow assumes the Copilot provider and local repository tools are
# available through Conductor/Copilot CLI.
workflow:
  name: layered-star
  description: Star-shaped layered TDD with a deterministic router, a guard and a light hub for frontier cases.
  version: "0.1.0"
  entry_point: preflight_tests
  runtime:
    provider: copilot
    default_model: gpt-6-sol
    default_reasoning_effort: medium
  context:
    mode: explicit
  instructions:
    - "This workflow is self-contained. Use the installed workflow prompts and any repo-local Conductor skills under `.github/skills/conductor-*/`; do not require LTDD documentation files to exist in the target repository."
    - "Before code-changing agent work, check whether a relevant `.github/skills/conductor-<skill>/SKILL.md` exists and follow it when applicable. A bounded context field that explicitly lists matching skill paths satisfies the existence check; do not search again when that list is present."
    - "If the Copilot CLI caveman skill is available, use caveman for planning notes, checkpoints, summaries, and human gate text. Keep artifact schemas, commands, paths, errors, and verification results exact and readable."
    - "For standard slices, the human-approved 02-slice-acceptance.json is the outer behavior contract. Its scenario and protected_files (tests, DSL, drivers, fixtures, approved persistence representations) remain read-only during layers. Report an incoherence instead of changing them. Layer regression excludes only the named pending outer AT; every other failure remains blocking and final slice acceptance must be green."
    - "When graphify-out/graph.json exists, use Graphify only for bounded repository-navigation questions before opening returned source locations. Do not rebuild or update the graph from an agent prompt."
    - "Never edit `.github/plans/*/star-state.json`; only the star_step guard writes it."
  limits:
    max_iterations: 500
    # The star benchmark runs each case with budget_mode: enforce.
    budget_usd: 5.0
    budget_mode: audit
  input:
    request:
      type: string
      required: false
      default: ""
      description: The code-changing objective. When empty, the objective gate asks for it.
    task_slug:
      type: string
      required: false
      default: ""
      description: Optional folder name under .github/plans/.
    test_command:
      type: string
      required: false
      default: make test
      description: Initial full suite; basis for the human-approved layer regression command.
    lint_command:
      type: string
      required: false
      default: make lint
      description: Command run before analysis and after implementation for lint/static checks.
    security_command:
      type: string
      required: false
      default: make audit
      description: Command run before analysis and after implementation for dependency/CVE checks.
    resume_path:
      type: string
      required: false
      default: ""
      description: Optional existing .github/plans/<slug> folder to resume (its star-state.json is reused).
    memory_vault:
      type: string
      required: false
      description: Absolute path to the Markdown memory vault root. Required for memory capture.
    memory_namespace:
      type: string
      required: false
      default: machine/agent-memory
      description: Markdown memory namespace under the vault root.
    memory_project:
      type: string
      required: false
      description: Markdown memory project slug. Required for memory capture.
    graphify_scope:
      type: string
      required: false
      description: Optional relative code directory for Graphify. A first build defaults to the repository root; an existing graph reuses its saved scan root.
    max_escalations:
      type: number
      required: false
      default: 5
      description: Escalations to the hub allowed per run before a gate asks whether to continue.

agents:
  # ---------------------------------------------------------------------------
  # Fixed entry: preflight -> graphify -> objective gate
  # ---------------------------------------------------------------------------
  - name: preflight_tests
    type: script
    description: Run the test suite before spending model time on analysis.
    command: sh
    args:
      - -lc
      - "{{ workflow.input.test_command }}"
    timeout: 600
    routes:
      - to: preflight_lint
        when: "{{ output.exit_code == 0 }}"
      - to: preflight_failure_gate

  - name: preflight_lint
    type: script
    description: Run lint/static checks before analysis.
    command: sh
    args:
      - -lc
      - "{{ workflow.input.lint_command }}"
    timeout: 600
    routes:
      - to: preflight_security
        when: "{{ output.exit_code == 0 }}"
      - to: preflight_failure_gate

  - name: preflight_security
    type: script
    description: Run dependency/CVE checks before analysis.
    command: sh
    args:
      - -lc
      - "{{ workflow.input.security_command }}"
    timeout: 600
    routes:
      - to: graphify_status
        when: "{{ output.exit_code == 0 }}"
      - to: preflight_failure_gate

  - name: preflight_failure_gate
    type: human_gate
    prompt: |
      A preflight command failed before requirements analysis. Fix the existing
      regression/check failure, override the Make target, or stop the workflow.
    options:
      - label: I fixed the failing preflight command; rerun preflight.
        value: retry
        route: preflight_tests
      - label: Continue anyway and record that preflight was waived.
        value: continue_with_waiver
        route: graphify_status
      - label: Stop before requirements analysis.
        value: stop
        route: stopped

  - name: graphify_status
    type: script
    description: Detect whether a reusable Graphify repository graph is available.
    command: sh
    args:
      - -lc
      - |
        if [ -f graphify-out/graph.json ]; then
          printf '{"graph_available":true,"summary":"Existing Graphify graph is available."}\n'
        else
          printf '{"graph_available":false,"summary":"No Graphify graph exists yet."}\n'
        fi
    routes:
      - to: graphify_update_gate

  - name: graphify_update_gate
    type: human_gate
    prompt: |
      Decide whether repository navigation should use a refreshed Graphify graph
      before requirements discovery. Graphify is optional; the Markdown
      artifacts and your reviews remain the authoritative workflow handoff.

      Current graph: {{ graphify_status.output.summary }}

      A first build scans repository code by default. To narrow the scan, provide
      `graphify_scope` in the run input (for example `src` or `packages/api`).
    options:
      - label: Build or incrementally refresh the focused Graphify graph.
        value: refresh
        route: graphify_refresh
      - label: Use the existing graph without refreshing it.
        value: use_existing
        route: star_step
      - label: Continue without Graphify for this run.
        value: skip
        route: star_step

  - name: graphify_refresh
    type: script
    description: Build a focused Graphify code graph or incrementally refresh the existing one.
    command: sh
    args:
      - -lc
      - |
        set -u
        graph_file="graphify-out/graph.json"
        graph_log="$(mktemp "${TMPDIR:-/tmp}/conductor-graphify.XXXXXX")"
        scope="${GRAPHIFY_SCOPE:-}"

        if [ -f "$graph_file" ] && [ -z "$scope" ] && [ -f graphify-out/.graphify_root ]; then
          scope="$(cat graphify-out/.graphify_root)"
        fi

        if [ -z "$scope" ]; then
          scope="."
        fi
        if [ ! -d "$scope" ]; then
          printf '{"graph_available":false,"refresh_succeeded":false,"reason":"invalid_scope","log_path":"%s","summary":"graphify_scope is not a readable directory."}\n' "$graph_log"
          exit 0
        fi
        if ! command -v graphify >/dev/null 2>&1; then
          printf '{"graph_available":false,"refresh_succeeded":false,"reason":"graphify_unavailable","log_path":"%s","summary":"The graphify CLI is not installed or not on PATH."}\n' "$graph_log"
          exit 0
        fi

        if [ -f "$graph_file" ]; then
          graphify "$scope" --update --code-only --directed --no-viz --out . >"$graph_log" 2>&1
        else
          graphify "$scope" --code-only --directed --no-viz --out . >"$graph_log" 2>&1
        fi
        graphify_exit_code=$?

        if [ "$graphify_exit_code" -eq 0 ] && [ -f "$graph_file" ]; then
          printf '{"graph_available":true,"refresh_succeeded":true,"reason":"","log_path":"%s","summary":"Graphify graph is ready for bounded repository queries."}\n' "$graph_log"
        else
          printf '{"graph_available":false,"refresh_succeeded":false,"reason":"graphify_failed","log_path":"%s","summary":"Graphify did not produce a usable graph; inspect the Graphify log and choose a recovery option."}\n' "$graph_log"
        fi
    env:
      GRAPHIFY_SCOPE: "{{ workflow.input.graphify_scope }}"
    routes:
      - to: star_step
        when: "{{ output.refresh_succeeded }}"
      - to: graphify_refresh_failure_gate

  - name: graphify_refresh_failure_gate
    type: human_gate
    prompt: |
      Graphify could not prepare a usable graph before requirements discovery.

      Result: {{ graphify_refresh.output.summary }}
      Reason: `{{ graphify_refresh.output.reason }}`
      Graphify log: `{{ graphify_refresh.output.log_path }}`

      Inspect the Graphify log, then restart with a corrected `graphify_scope`
      or Graphify installation if needed. You can also continue without a graph.
    options:
      - label: Continue without Graphify for this run.
        value: continue_without_graph
        route: star_step
      - label: Stop and fix the Graphify setup.
        value: stop
        route: stopped

  - name: objective_gate
    type: human_gate
    prompt: |
      What are we going to work on? Describe the code-changing objective.
      An empty answer asks again; choose Cancel to end the run.
    options:
      - label: Work on this objective.
        value: objective
        prompt_for: objective
        multiline: true
        route: star_step
      - label: Cancel the run.
        value: cancel
        route: cancelled

  # ---------------------------------------------------------------------------
  # Center: star_step (router + guard), hub and the generic confirmation gate
  # ---------------------------------------------------------------------------
  - name: star_step
    type: script
    description: Deterministic router and guard; the only writer of the star ledger.
    command: python3
    args:
      - workflows/conductor/scripts/star-step.py
    timeout: 300
    input:
      - star_step.output?
      - preflight_failure_gate.output?
      - graphify_status.output?
