  - name: hub
    description: Propose the next spoke for a frontier case; never decides alone on non-obvious jumps.
    model: gpt-6-luna
    reasoning:
      effort: high
    tools: []
    input:
      - star_step.output.hub_input
    prompt: !file prompts/star-hub.md
    output:
      next:
        type: string
        enum: [requirements, triage, fast-change, slice-selection, acceptance-design, acceptance-build, layer-map, layer-select, layer-todo, test-author, red-gate, implement, verify, layer-review, cleanup-plan, cleanup-implement, cleanup-verify, cleanup-review, final, memory, ask_human, stop]
        description: Next spoke, ask_human or stop.
      reason:
        type: string
        description: Why this spoke.
      brief:
        type: string
        description: Concrete instruction for the destination spoke.
      alternatives:
        type: array
        description: 0-2 other legal options as objects with next and reason.
      confidence:
        type: string
        enum: [low, medium, high]
        description: Confidence in the proposal.
    routes:
      - to: star_step

  - name: confirm_gate
    type: questions
    description: Generic confirmation of a non-obvious jump with its computed consequences.
    input:
      - star_step.output.confirm_prompt?
      - star_step.output.confirm_questions?
    prompt: |
      Non-obvious jump: confirm, pick an alternative, write something else or stop.
    source: star_step.output.confirm_questions
    allow_back: false
    allow_skip: false
    allow_skip_all: false
    allow_abort: false
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: requirements
  # ---------------------------------------------------------------------------
  - name: requirements_griller
    description: Capture requirements, blockers, assumptions, and slice split.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - workflow.input.request
      - workflow.input.resume_path?
      - workflow.input.memory_vault?
      - workflow.input.memory_namespace?
      - workflow.input.memory_project?
      - graphify_status.output.graph_available?
      - graphify_status.output.summary?
      - graphify_refresh.output.graph_available?
      - graphify_refresh.output.summary?
      - star_step.output.objective
      - star_step.output.brief?
    prompt: !file prompts/requirements-griller.md
    output:
      artifact_path:
        type: string
        description: Path to the requirements or slice-selection artifact.
      task_slug:
        type: string
        description: Current or recommended task slug.
      multiple_slices:
        type: boolean
        description: True when the request contains multiple valuable slices.
      blocker_count:
        type: number
        description: Number of unresolved blocker questions.
      summary:
        type: string
        description: Short human-readable summary of what was produced.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' or output.multiple_slices }}"
      - to: requirements_gate

  - name: requirements_gate
    type: human_gate
    prompt: |
      Review `00-requirements.md`. Confirm the selected slice goal, blockers,
      non-blocker assumptions, and explicitly out-of-scope work. If you edited
      `00-requirements.md` or added feedback there, choose revise so the
      pinned reviser can update that same artifact before mapping.

      Requirements artifact: `{{ requirements_griller.output.artifact_path }}`
      Task slug: `{{ requirements_griller.output.task_slug }}`
      Blocker count: {{ requirements_griller.output.blocker_count }}
      Summary: {{ requirements_griller.output.summary }}
    options:
      - label: Requirements are confirmed for one selected slice.
        value: approve
        prompt_for: feedback
        route: star_step
      - label: I edited or commented on requirements; revise this same artifact.
        value: revise
        prompt_for: feedback
        route: requirements_reviser
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this run.
        value: stop
        route: star_step

  - name: requirements_reviser
    description: Reconcile human feedback into the originally created requirements artifact.
    model: gpt-6-sol
    reasoning:
      effort: high
    input:
      - requirements_griller.output.artifact_path
      - star_step.output.brief?
    prompt: !file prompts/requirements-reviser.md
    output:
      artifact_path:
        type: string
        description: The same requirements artifact revised in place.
      task_slug:
        type: string
        description: Unchanged task slug for the active requirements artifact.
      blocker_count:
        type: number
        description: Number of unresolved blocker questions after revision.
      summary:
        type: string
        description: Short human-readable summary of the revision.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step
        when: "{{ output.outcome != 'done' }}"
      - to: requirements_revision_gate

  - name: requirements_revision_gate
    type: human_gate
    prompt: |
      Review the requirements revision. This is the same artifact as before;
      it was revised in place rather than started as a new plan.

      Requirements artifact: `{{ requirements_reviser.output.artifact_path }}`
      Task slug: `{{ requirements_reviser.output.task_slug }}`
      Blocker count: {{ requirements_reviser.output.blocker_count }}
      Summary: {{ requirements_reviser.output.summary }}
    options:
      - label: Requirements are confirmed for this same slice.
        value: approve
        prompt_for: feedback
        route: star_step
      - label: I edited or commented on requirements; revise this same artifact again.
        value: revise
        prompt_for: feedback
        route: requirements_reviser
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this run.
        value: stop
        route: star_step

  # ---------------------------------------------------------------------------
  # Spoke: triage
  # ---------------------------------------------------------------------------
  - name: fast_triage
    description: Route only clearly bounded work that needs no new or changed tests.
    model: gpt-6-luna
    reasoning:
      effort: high
    input:
      - workflow.input.request
      - workflow.input.resume_path?
      - graphify_status.output?
      - graphify_refresh.output?
      - graphify_update_gate.output?
      - requirements_griller.output.artifact_path?
      - star_step.output.objective
      - star_step.output.brief?
    prompt: !file prompts/fast-triage.md
    output:
      route:
        type: string
        description: Exactly fast or standard.
      reason:
        type: string
        description: Why the request qualifies or needs the full workflow.
      allowed_paths:
        type: array
        description: Exact repository-relative files permitted for fast implementation; empty for standard.
      acceptance_criteria:
        type: string
        description: Observable completion check for a fast request.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: star_step

  # ---------------------------------------------------------------------------
  # Spoke: fast-change
  # ---------------------------------------------------------------------------
  - name: fast_snapshot
    type: script
    description: Preserve the working tree before fast implementation.
    command: python3
    args:
      - workflows/conductor/scripts/capture-layer-snapshot.py
    routes:
      - to: fast_implementor

  - name: fast_implementor
    description: Make one bounded change or return untouched to the full workflow.
    model: gpt-6-luna
    reasoning:
      effort: high
    input:
      - workflow.input.request
      - fast_triage.output.reason
      - fast_triage.output.allowed_paths
      - fast_triage.output.acceptance_criteria
      - fast_approval_gate.output?
      - star_step.output.objective
      - star_step.output.brief?
    prompt: !file prompts/fast-implementor.md
    output:
      needs_normal_path:
        type: boolean
        description: True only when the request needs tests, broader scope, or unresolved decisions.
      summary:
        type: string
        description: Completed change or reason for returning to the full workflow.
      outcome:
        type: string
        enum: [done, blocked, needs-human, incoherence]
      reason:
        type: string
      artifacts:
        type: array
      incoherence:
        type: object
    routes:
      - to: fast_change_check

  - name: fast_change_check
    type: script
    description: Verify the fast diff is confined to triage-approved files (I4).
    input:
      - fast_snapshot.output.snapshot_tree
      - fast_triage.output.allowed_paths
    command: python3
    args:
      - workflows/conductor/scripts/create-layer-diff.py
      - --snapshot-tree
      - "{{ fast_snapshot.output.snapshot_tree }}"
      - --allowed-paths-json
      - "{{ fast_triage.output.allowed_paths | tojson }}"
    routes:
      - to: fast_verification_tests
        when: "{{ not fast_implementor.output.needs_normal_path and fast_implementor.output.outcome == 'done' and output.boundary_status == 'passed' and output.changed_files | length > 0 }}"
      - to: star_step

  - name: fast_verification_tests
    type: script
    description: Run the configured test command after the fast change.
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - fast-tests
      - --command
      - "{{ workflow.input.test_command }}"
    timeout: 600
    routes:
      - to: fast_verification_lint

  - name: fast_verification_lint
    type: script
    description: Run lint/static checks after the fast change.
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - fast-lint
      - --command
      - "{{ workflow.input.lint_command }}"
    timeout: 600
    routes:
      - to: fast_verification_security

  - name: fast_verification_security
    type: script
    description: Run dependency/security checks after the fast change.
    command: python3
    args:
      - workflows/conductor/scripts/run-verification.py
      - --kind
      - fast-security
      - --command
      - "{{ workflow.input.security_command }}"
    timeout: 600
    routes:
      - to: fast_approval_gate
        when: "{{ fast_verification_tests.output.exit_code == 0 and fast_verification_lint.output.exit_code == 0 and output.exit_code == 0 }}"
      - to: star_step

  - name: fast_approval_gate
    type: human_gate
    prompt: |
      Review the fast change and its checks.

      Objective: {{ star_step.output.objective }}
      Acceptance criterion: {{ fast_triage.output.acceptance_criteria }}
      Files: {{ fast_change_check.output.changed_files }}
      Change: {{ fast_implementor.output.summary }}
      Tests/lint/security: {{ fast_verification_tests.output.exit_code }} / {{ fast_verification_lint.output.exit_code }} / {{ fast_verification_security.output.exit_code }}
      Patch: `{{ fast_change_check.output.patch_path }}`{% if fast_change_check.output.patch_truncated %} (preview truncated){% endif %}

      ```diff
      {{ fast_change_check.output.bounded_patch }}
      ```
    options:
      - label: Approve this fast change.
        value: approve
        route: star_step
      - label: Request a focused fix.
        value: fix
        prompt_for: feedback
        route: fast_implementor
      - label: Redirect the run; describe in free text what should happen (goes to the hub).
        value: redirect
        prompt_for: redirect
        multiline: true
        route: star_step
      - label: Stop this run.
        value: stop
        route: star_step

